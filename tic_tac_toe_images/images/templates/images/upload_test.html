<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Upload Image</title>
</head>
<body>
    <h2>Test Upload Image</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Upload</button>
    </form>
    {% if success %}
        <p>Image uploaded successfully!</p>
        {% if uploaded_image_url %}
            <p>Uploaded Image URL: <a href="{{ uploaded_image_url }}">{{ uploaded_image_url }}</a></p>
            <img src="{{ uploaded_image_url }}" alt="Uploaded Image" width="200">
        {% endif %}
    {% endif %}
    {% if error_message %}
        <p style="color: red;">Error: {{ error_message }}</p>
    {% endif %}
</body>
</html>
